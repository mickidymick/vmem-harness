# QMCPACK 3.11.9 (NiO S64 supercell, 256 atoms / 3072 electrons, VMC) — benchmark record.
name: qmcpack
kind: openmp            # MPI-linked, run direct as one OpenMP process
exe: run/exe            # 2023-05-22 build; see build.sh. Staged by ./stage.sh.

# qmcpack_paper.xml == memory-ef's test_small.xml: VMC, 40 walkers (QMCPACK rounds
# to 2 per thread = 32), 5 warmup steps x 5 substeps, 1 block. Native on corsys4:
# 17.1 GB peak RSS, 67 s startup (h5 read + 3.4 GB spline build) + 422 s VMC under
# heavy load. qmcpack_smoke.xml: 16 walkers, 1 warmup step, 1 substep.
# The input's href="./NiO/..." resolves against the run dir, so inputs are
# symlinked INTO run/ by stage.sh.
args: "qmcpack_paper.xml"

# metric: the QMC section only, excluding the startup that reads 2.2 GB of orbitals.
metric: 'QMC Execution time = ([\d.eE+-]+) secs'
metric_reduce: first
lower_is_better: true

# Everything QMCPACK writes into the run dir, deleted before each run so a crashed
# run cannot be scored from the previous run's scalar.dat.
outputs:
  - NiO-fcc-S64-dmc.s001.scalar.dat
  - NiO-fcc-S64-dmc.s001.stat.h5
  - NiO-fcc-S64-dmc.s001.qmc.xml
  - NiO-fcc-S64-dmc.s001.cont.xml
  - NiO-fcc-S64-dmc.info.xml

# correctness: the VMC block's LocalEnergy. OPEN QUESTION, not settled noise:
#  - NATIVE runs are deterministic: smoke all_dram and all_pmem gave bit-identical
#    -22239.373056 (2026-09-17).
#  - Runs under the vmem substrate SOMETIMES differ from native, EVEN WITH TIERING
#    OFF: smoke first_touch -22231.940 (3.3e-4 rel) once, then bit-identical to native
#    in two repeats (repro run 20260917-124406); paper-size measure -23727.789 vs native
#    -23730.909 (1.3e-4 rel). Native never varied. Intermittent => nondeterminism or
#    silent corruption introduced by the substrate (allocator or vmem).
#  The shift is ~0.5 sigma of the VMC statistics, which fits an allocator-dependent
#  code path (mimalloc vs glibc: different addresses/alignment changing an OpenMP
#  reduction or iteration order) but does not rule out silent corruption. Tolerance
#  1e-3 (~4 sigma) lets vmem conditions pass while this is unresolved. It catches a
#  broken wavefunction, not a subtle one. Check native + stock-mimalloc LD_PRELOAD to
#  separate allocator from vmem.
correctness:
  - name: local_energy
    source: NiO-fcc-S64-dmc.s001.scalar.dat
    metric: '\n\s*0\s+([\d.eE+-]+)'
    reduce: last
    tolerance: 1.0e-3
